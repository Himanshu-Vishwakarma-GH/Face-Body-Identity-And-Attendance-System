<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="kiosk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0)" />
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.35)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0)" />
    </linearGradient>
  </defs>

  <!-- Monitor Frame -->
  <rect width="1000" height="620" rx="20" fill="#030509" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <!-- Top Bar -->
  <rect x="2" y="2" width="996" height="50" rx="18" fill="#090e1a" />
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="48" cy="26" r="6" fill="#eab308" opacity="0.8" />
  <circle cx="68" cy="26" r="6" fill="#22c55e" opacity="0.8" />
  <text x="500" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">DOOR ENTRY KIOSK &bull; LIVE RETICLE STATION (PORT 8000/camera)</text>

  <!-- Viewport Grid -->
  <g transform="translate(30, 70)">
    <!-- Main Camera Box -->
    <rect width="640" height="520" rx="16" fill="url(#kiosk-bg)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5" />

    <!-- Optical Scanline -->
    <rect x="1" y="220" width="638" height="40" fill="url(#scanline-grad)" />

    <!-- Reticle Brackets -->
    <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#06b6d4" stroke-width="3" />
    <path d="M 600 40 L 600 80" fill="none" stroke="#06b6d4" stroke-width="3" />
    <path d="M 560 40 L 600 40" fill="none" stroke="#06b6d4" stroke-width="3" />
    <path d="M 40 440 L 40 480 L 80 480" fill="none" stroke="#06b6d4" stroke-width="3" />
    <path d="M 560 480 L 600 480 L 600 440" fill="none" stroke="#06b6d4" stroke-width="3" />

    <!-- Center Facial Bounding Box -->
    <rect x="220" y="120" width="200" height="240" rx="8" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M 220 140 L 220 120 L 240 120" fill="none" stroke="#10b981" stroke-width="3.5" />
    <path d="M 400 120 L 420 120 L 420 140" fill="none" stroke="#10b981" stroke-width="3.5" />
    <path d="M 220 340 L 220 360 L 240 360" fill="none" stroke="#10b981" stroke-width="3.5" />
    <path d="M 400 360 L 420 360 L 420 340" fill="none" stroke="#10b981" stroke-width="3.5" />

    <!-- Pose Keypoints Silhouette -->
    <circle cx="320" cy="180" r="5" fill="#38bdf8" />
    <circle cx="280" cy="270" r="4" fill="#38bdf8" />
    <circle cx="360" cy="270" r="4" fill="#38bdf8" />
    <line x1="280" y1="270" x2="360" y2="270" stroke="#38bdf8" stroke-width="2" />
    <line x1="320" y1="180" x2="320" y2="340" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Live HUD Status Overlay -->
    <rect x="20" y="20" width="180" height="32" rx="8" fill="rgba(0, 0, 0, 0.65)" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="34" cy="36" r="4" fill="#10b981" />
    <text x="46" y="40" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">RETICLE ACTIVE</text>
    <text x="160" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">29 FPS</text>

    <!-- Bottom Decision Banner: ACCESS GRANTED -->
    <rect x="40" y="440" width="560" height="54" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="60" y="473" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">ACCESS GRANTED &bull; VERIFIED</text>
    <text x="560" y="473" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="end">Himanshu V. (EMP-104)</text>
  </g>

  <!-- Right Side Telemetry Panel -->
  <g transform="translate(690, 70)">
    <rect width="280" height="520" rx="16" fill="#090e1a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <text x="24" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Biometric Telemetry</text>
    <text x="24" y="56" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">REAL-TIME INFERENCE</text>

    <!-- Metric 1: Face Confidence -->
    <g transform="translate(24, 85)">
      <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">FACE COSINE SIMILARITY</text>
      <text x="232" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">94.8%</text>
      <rect y="10" width="232" height="8" rx="4" fill="#1e293b" />
      <rect y="10" width="220" height="8" rx="4" fill="#10b981" />
    </g>

    <!-- Metric 2: Body Anthropometry -->
    <g transform="translate(24, 140)">
      <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">BODY SKELETON RATIO</text>
      <text x="232" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">91.2%</text>
      <rect y="10" width="232" height="8" rx="4" fill="#1e293b" />
      <rect y="10" width="211" height="8" rx="4" fill="#38bdf8" />
    </g>

    <!-- Metric 3: Anti-Tailgating Person Count -->
    <g transform="translate(24, 195)">
      <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">DETECTED PERSON COUNT</text>
      <text x="232" y="0" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="end">1 PERSON</text>
      <rect y="10" width="232" height="8" rx="4" fill="#1e293b" />
      <rect y="10" width="116" height="8" rx="4" fill="#a855f7" />
    </g>

    <!-- Tailgating Guard Alert Box -->
    <g transform="translate(24, 250)">
      <rect width="232" height="75" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="16" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TAILGATING RADAR</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Perimeter Clear</text>
      <text x="16" y="64" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Swipe-Person correlation: 1:1</text>
    </g>

    <!-- Access Card Swipe Input Simulation Box -->
    <g transform="translate(24, 345)">
      <rect width="232" height="145" rx="10" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="16" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BADGE SWIPE READER</text>
      <rect x="16" y="40" width="200" height="36" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="28" y="63" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12">EMP-104</text>
      
      <rect x="16" y="90" width="200" height="38" rx="8" fill="#0284c7" />
      <text x="116" y="114" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">Swipe / Verify Now</text>
    </g>
  </g>
</svg>
