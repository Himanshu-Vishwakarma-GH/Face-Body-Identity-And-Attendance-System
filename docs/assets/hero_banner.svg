<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(6, 182, 212, 0.25)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#tech-grid)" />

  <!-- Outer HUD Border -->
  <rect x="20" y="20" width="1160" height="380" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  
  <!-- Corner Tech Brackets -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <path d="M 20 360 L 20 400 L 60 400" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <path d="M 1140 400 L 1180 400 L 1180 360" fill="none" stroke="#06b6d4" stroke-width="3.5" />

  <!-- Top Status Pill -->
  <g transform="translate(60, 45)">
    <rect width="260" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" letter-spacing="1">SYSTEM ARMED &amp; OPERATIONAL</text>
  </g>

  <!-- IBM Hackathon Badge -->
  <g transform="translate(920, 45)">
    <rect width="220" height="28" rx="14" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="110" y="18" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" letter-spacing="1" text-anchor="middle">IBM HACKATHON 2026</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="140" fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    AI Face &amp; Body Identity Matrix
  </text>
  <text x="60" y="175" fill="url(#accent-cyan)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="0.5">
    Enterprise Autonomous Access Control &bull; Biometric Anti-Tailgating &bull; Multi-Zone Surveillance
  </text>

  <text x="60" y="215" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="500" font-size="14" opacity="0.9">
    Continuous 1:1 Cosine Similarity Verification &bull; Anthropometric Body Ratios &bull; Zero-Technical Hardware Pairing
  </text>

  <!-- Tech Feature Badges Grid -->
  <g transform="translate(60, 265)">
    <!-- Badge 1: InsightFace -->
    <g transform="translate(0, 0)">
      <rect width="250" height="85" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="20" y="32" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">512-DIM INSIGHTFACE</text>
      <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">ArcFace Cosine Matching</text>
      <text x="20" y="70" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">&gt;92% Verified Confidence</text>
    </g>

    <!-- Badge 2: YOLOv8 Pose -->
    <g transform="translate(270, 0)">
      <rect width="250" height="85" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="20" y="32" fill="#10b981" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">YOLOV8 POSE ESTIMATION</text>
      <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Body Anthropometrics</text>
      <text x="20" y="70" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Shoulder-to-Hip Skeletal Ratios</text>
    </g>

    <!-- Badge 3: Anti-Tailgating -->
    <g transform="translate(540, 0)">
      <rect width="250" height="85" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="20" y="32" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">TAILGATING RADAR</text>
      <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Person-Swipe Correlation</text>
      <text x="20" y="70" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">5-Second Corridor Detection</text>
    </g>

    <!-- Badge 4: Redis Encrypted Stack -->
    <g transform="translate(810, 0)">
      <rect width="270" height="85" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="20" y="32" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">REDIS VECTOR VAULT</text>
      <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">AES-256-GCM Encrypted</text>
      <text x="20" y="70" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Sub-15ms In-Memory TTL Cache</text>
    </g>
  </g>

  <!-- Decorative Reticle on Right Side -->
  <g transform="translate(1080, 160)" opacity="0.35">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#3b82f6" stroke-width="1" />
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#06b6d4" stroke-width="1.5" />
  </g>
</svg>
